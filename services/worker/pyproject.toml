[project]
name = "tryon-worker"
version = "0.1.0"
description = "Background worker that renders try-on jobs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0.35,<2.1",
    "psycopg[binary]>=3.2,<3.3",
    "redis>=5.1,<6",
    "boto3>=1.35,<1.36",
    "pillow>=10.4,<11",
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
