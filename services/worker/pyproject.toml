[project]
name = "tryon-worker"
version = "0.2.0"
description = "RQ worker that renders virtual try-on jobs"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "sqlalchemy>=2.0.35,<2.1",
    "psycopg[binary]>=3.2,<3.3",
    "redis>=5.1,<6",
    "rq>=2.0,<3",
    "boto3>=1.35,<1.36",
    "pillow>=10.4,<11",
    "httpx>=0.27,<0.28",
]

[project.optional-dependencies]
# Heavy model dependencies for the `assets` worker only (FashionCLIP embeddings, rembg, SAM 2). The try-on worker
# does not need them. SAM 2 must be installed with `pip install --no-build-isolation sam2` after torch (see
# Dockerfile.assets), because its build would otherwise download a second copy of PyTorch.
assets = [
    "numpy>=1.26",
    "torch>=2.5",
    "torchvision>=0.20",
    "transformers>=4.44",
    "rembg[cpu]>=2.0.60",
    "onnxruntime>=1.18",
]
dev = [
    "numpy>=1.26",
    "pytest>=8.3",
    "moto[s3,server]>=5.0,<6",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["worker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:moto.*", "ignore::DeprecationWarning:botocore.*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
