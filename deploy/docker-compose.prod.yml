name: elevariq

# Production stack for ONE VPS: Caddy (HTTPS), the API, the try-on worker and Redis.
# Postgres is NOT here: it is a managed database (see DEPLOY.md). Kiosk and admin run on Vercel.
#
#   cp .env.production.example .env.production      # then fill it in
#   python3 preflight.py                             # refuses obvious mistakes (dev keys, http origins, ...)
#   ./compose.sh build && ./compose.sh run --rm migrate && ./compose.sh up -d
#
# Only Caddy publishes ports (80, 443). The API and Redis are reachable only inside the Docker network.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Everything an app container needs: the same hardening for each.
x-hardened: &hardened
  restart: unless-stopped
  logging: *logging
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-app-env: &app-env
  # The rest comes from env_file. These are derived, so they cannot disagree with the Redis password.
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.production (Let's Encrypt uses it for expiry notices)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep this volume, or Let's Encrypt rate limits bite on re-creation
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

  api:
    <<: *hardened
    build:
      context: ../services/api
      dockerfile: Dockerfile.prod
    image: elevariq/api:${RELEASE:-latest}
    env_file: .env.production
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy

  worker:
    <<: *hardened
    build:
      context: ../services/worker
      dockerfile: Dockerfile.prod
    image: elevariq/worker:${RELEASE:-latest}
    env_file: .env.production
    environment:
      <<: *app-env
      WORKER_QUEUES: tryon
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    # Append-only file, so queued try-ons survive a restart. noeviction: never silently drop a job or a counter.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # One-off: `./compose.sh run --rm migrate`. Run it before `up` on every release that adds a migration.
  migrate:
    build:
      context: ../services/api
      dockerfile: Dockerfile.prod
    image: elevariq/api:${RELEASE:-latest}
    profiles: ["tools"]
    env_file: .env.production
    environment: *app-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # Optional and heavy (PyTorch, FashionCLIP, rembg, SAM 2, several GB): embeddings and background removal for
  # new products. It needs far more RAM than the rest. Run it here with `--profile assets`, or on another machine.
  assets-worker:
    profiles: ["assets"]
    build:
      context: ../services/worker
      dockerfile: Dockerfile.assets
    image: elevariq/assets-worker:${RELEASE:-latest}
    restart: unless-stopped
    logging: *logging
    env_file: .env.production
    environment:
      <<: *app-env
      WORKER_QUEUES: assets
    depends_on:
      redis:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  redis_data:
